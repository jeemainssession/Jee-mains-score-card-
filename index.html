<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JEE Scorecard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { width: 300px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>JEE Scorecard Login</h2>
        <input type="text" id="appNumber" placeholder="Application Number">
        <input type="text" id="dob" placeholder="Date of Birth (DD-MM-YYYY)">
        <button onclick="login()">Submit</button>
    </div>

    <script>
        function login() {
            var appNumber = document.getElementById("appNumber").value;
            var dob = document.getElementById("dob").value;

            if (appNumber === "250310484347" && dob === "12-02-2025") {
                window.location.href = "scorecard.html";
            } else {
                alert("Invalid Login Details");
            }
        }
    </script>
</body>
</html>
